<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="ShiftChain — verified responsibility handoffs on Google Cloud.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22><rect width=%2232%22 height=%2232%22 rx=%228%22 fill=%22%233949ab%22/><text x=%226%22 y=%2221%22 font-size=%2213%22 font-family=%22Arial%22 font-weight=%22700%22 fill=%22white%22>SC</text></svg>">
  <title>ShiftChain — Responsibility Journey</title>
  <style>
    :root{--paper:#f7f6f1;--surface:#fff;--ink:#202124;--muted:#65676b;--line:#deded7;--indigo:#3949ab;--indigo-soft:#eef0ff;--green:#177245;--green-soft:#e9f6ee;--amber:#a45b00;--amber-soft:#fff3da;--red:#b3261e;--red-soft:#fcebea;--shadow:0 12px 34px rgba(32,33,36,.07)}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;line-height:1.38}button,input{font:inherit}button{cursor:pointer}.shell{max-width:1500px;margin:auto;padding:14px 20px 18px}.topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:24px;margin-bottom:10px}.brandline{display:flex;align-items:center;gap:11px}.mark{width:34px;height:34px;border:2px solid var(--indigo);border-radius:10px;display:grid;place-items:center;color:var(--indigo);font-weight:800}.brand h1{font-size:22px;line-height:1;margin:0 0 4px;letter-spacing:-.03em}.tagline{color:var(--muted);font-size:13px}.badges{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:7px}.badge{border:1px solid var(--line);background:rgba(255,255,255,.75);border-radius:999px;padding:5px 8px;font-size:10px;font-weight:750;letter-spacing:.045em;text-transform:uppercase}.badge.cloud{color:var(--indigo);border-color:#cfd3ff}.badge.judge{color:var(--amber);border-color:#eacb91;background:#fffaf0}.controls{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:13px;padding:7px 10px;margin-bottom:10px}.primary{border:0;background:var(--indigo);color:#fff;border-radius:8px;padding:8px 13px;font-weight:750}.primary:hover{background:#303f9f}.primary:focus-visible,.deliver:focus-visible,input:focus-visible{outline:3px solid #9da8ff;outline-offset:2px}.runbox{min-width:240px;flex:1;border:0;border-left:1px solid var(--line);padding:6px 11px;color:var(--muted);background:transparent}.switch{display:flex;align-items:center;gap:7px;font-size:11px;font-weight:700;color:var(--amber);white-space:nowrap}.switch input{accent-color:var(--amber)}.sync{font-size:11px;color:var(--muted);min-width:176px;text-align:right}.grid{display:grid;grid-template-columns:260px minmax(560px,1fr) 272px;gap:12px;align-items:stretch}.panel{background:var(--surface);border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow);padding:12px}.panel-title{margin:0 0 2px;font-size:10px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase}.panel-sub{margin:0 0 8px;color:var(--muted);font-size:11px}.event-list{display:grid;gap:6px}.event{border:1px solid var(--line);border-radius:10px;padding:7px 8px;background:#fdfdfb}.event-head{display:flex;justify-content:space-between;align-items:center;gap:8px}.event-num{font-size:10px;font-weight:800;color:var(--indigo);letter-spacing:.06em}.status{font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.045em;padding:2px 5px;border-radius:999px;background:#f0f0ed;color:var(--muted)}.status.verified{background:var(--green-soft);color:var(--green)}.status.waiting{background:var(--amber-soft);color:var(--amber)}.event h3{font-size:12px;margin:4px 0 0}.event p{font-size:11px;color:var(--muted);margin:0 0 4px}.event details{font-size:10px}.event details p{margin-top:5px}.deliver{width:100%;border:1px solid #c9ccef;color:var(--indigo);background:var(--indigo-soft);border-radius:7px;padding:4px;font-size:10px;font-weight:800}.deliver:disabled{border-color:var(--line);background:#f3f3ef;color:#8b8b86;cursor:default}.journey{min-height:405px;position:relative;overflow:hidden}.journey:before{content:"";position:absolute;width:320px;height:320px;border-radius:50%;background:#f3f2ff;right:-170px;top:-180px}.chain{position:relative;border-top:1px solid var(--line);padding:15px 4px 17px}.chain:first-of-type{border-top:0}.chain-label{display:flex;justify-content:space-between;align-items:center;margin-bottom:13px}.chain-label strong{font-size:12px}.chain-label span{font-size:10px;color:var(--muted)}.journey-row{display:grid;grid-template-columns:132px minmax(94px,1fr) 132px minmax(94px,1fr) 132px;align-items:center}.journey-row.two{grid-template-columns:150px minmax(140px,1fr) 150px;padding:4px 65px}.person{position:relative;z-index:1;border:1px solid var(--line);background:#fff;border-radius:13px;padding:10px;text-align:center;min-height:70px;display:grid;place-content:center}.person.active{border-color:#a9d4bd;background:#fbfffc}.person strong{display:block;font-size:14px}.person small{display:block;color:var(--muted);font-size:9px;margin-top:3px}.edge{height:3px;background:#c9c9c2;position:relative}.edge:after{content:"";position:absolute;right:-1px;top:-5px;border-left:9px solid #c9c9c2;border-top:6px solid transparent;border-bottom:6px solid transparent}.edge.verified{background:var(--green)}.edge.verified:after{border-left-color:var(--green)}.edge.waiting{height:0;border-top:3px dashed #cf8b28;background:transparent}.edge.waiting:after{border-left-color:#cf8b28;top:-7px}.edge-label{position:absolute;left:50%;top:-21px;transform:translateX(-50%);white-space:nowrap;font-size:9px;font-weight:800;color:var(--muted);background:var(--surface);padding:1px 4px}.edge.verified .edge-label{color:var(--green)}.edge.waiting .edge-label{color:var(--amber)}.moment{border-radius:11px;margin-top:7px;padding:9px 11px;background:var(--indigo-soft);border:1px solid #d9dcff;display:flex;align-items:center;justify-content:space-between;gap:14px}.moment strong{font-size:11px;color:var(--indigo)}.moment span{font-size:10px;color:var(--muted)}.moment.lost{background:var(--red-soft);border-color:#f2c4c0}.moment.lost strong{color:var(--red)}.moment.proven{background:var(--green-soft);border-color:#bfe0cd}.moment.proven strong{color:var(--green)}.evidence-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}.metric{border-bottom:1px solid var(--line);padding:4px 0 6px}.metric.wide{grid-column:1/-1}.metric label{display:block;font-size:8px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:800}.metric strong{display:block;margin-top:2px;font-size:11px;word-break:break-word}.match{color:var(--green)}.proof-card{margin-top:8px;border-radius:11px;padding:8px;background:#fafaf7;border:1px solid var(--line)}.proof-card h3{font-size:10px;margin:0 0 5px}.proof-row{display:flex;justify-content:space-between;font-size:10px;margin:4px 0}.proof-row strong{font-size:10px}.lower{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:12px;margin-top:10px}.lower>.panel{min-width:0}.activity{display:flex;min-width:0;gap:0;overflow-x:auto;padding:6px 0 2px}.activity-item{min-width:137px;position:relative;padding:17px 10px 3px 0;color:var(--muted);font-size:10px}.activity-item:before{content:"";position:absolute;top:5px;left:0;width:8px;height:8px;border-radius:50%;background:var(--indigo);box-shadow:0 0 0 3px var(--indigo-soft)}.activity-item:after{content:"";position:absolute;top:8px;left:12px;right:5px;height:1px;background:#cfd3ee}.activity-item:last-child:after{display:none}.activity-item strong{display:block;color:var(--ink);font-size:10px;margin-bottom:1px}.responsibilities{display:grid;gap:0}.responsibility{display:grid;grid-template-columns:90px 1fr auto;gap:8px;border-top:1px solid var(--line);padding:5px 0;font-size:10px;align-items:center}.responsibility:first-child{border-top:0}.responsibility time{color:var(--muted)}.responsibility strong{font-size:10px}.owner{color:var(--indigo);font-weight:750}.loading{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#202124;color:#fff;border-radius:999px;padding:10px 16px;box-shadow:0 10px 30px rgba(0,0,0,.2);font-size:12px;z-index:20}.loading[hidden]{display:none}.empty{display:grid;place-items:center;min-height:380px;text-align:center;color:var(--muted)}.empty strong{display:block;color:var(--ink);font-size:18px;margin-bottom:6px}.error{color:var(--red)}
    @media(max-width:1100px){.grid{grid-template-columns:230px 1fr}.evidence-panel{grid-column:1/-1}.evidence-grid{grid-template-columns:repeat(5,1fr)}.metric.wide{grid-column:auto}.journey-row{grid-template-columns:115px 1fr 115px 1fr 115px}.journey-row.two{padding:4px 35px}.lower{grid-template-columns:1fr}}
    @media(max-width:760px){.shell{padding:14px}.topbar{display:block}.badges{justify-content:flex-start;margin-top:12px}.controls{flex-wrap:wrap}.runbox{order:3;flex-basis:100%;border-left:0;border-top:1px solid var(--line)}.grid{display:block}.panel{margin-bottom:12px}.journey-row,.journey-row.two{grid-template-columns:1fr;padding:0}.edge{height:50px;width:3px;margin:auto}.edge:after{right:-4px;top:auto;bottom:-1px;border-top:9px solid #c9c9c2;border-left:6px solid transparent;border-right:6px solid transparent;border-bottom:0}.edge.verified:after{border-top-color:var(--green);border-left-color:transparent}.edge.waiting{width:0;height:50px;border-top:0;border-left:3px dashed #cf8b28}.edge.waiting:after{border-top-color:#cf8b28;border-left-color:transparent;top:auto}.edge-label{top:14px;left:14px;transform:none}.lower{display:block}}
  </style>
</head>
<body>
<div class="shell">
  <header class="topbar">
    <div class="brandline"><div class="mark" aria-hidden="true">SC</div><div class="brand"><h1>ShiftChain</h1><div class="tagline">Responsibility moves. ShiftChain keeps the truth.</div></div></div>
    <div class="badges" aria-label="Technology stack"><span class="badge cloud">Live on Google Cloud</span><span class="badge">Gemini 3.7 Flash</span><span class="badge">Google ADK</span><span class="badge judge">Demo / Judge Mode</span></div>
  </header>
  <section class="controls" aria-label="Demo controls">
    <button class="primary" id="reset">Reset Demo</button>
    <label class="switch"><input id="reliability" type="checkbox" checked> Reliability proof: ON</label>
    <input class="runbox" id="run" aria-label="Current run ID" placeholder="Create a fresh demo run" readonly>
    <div class="sync" id="sync">Ready for a fresh run</div>
  </section>
  <main id="app"><div class="panel empty"><div><strong>The story starts with responsibility.</strong>Reset the demo, then deliver each frozen event.</div></div></main>
</div>
<div class="loading" id="loading" role="status" aria-live="polite" hidden></div>
<script>
const EVENT_COPY={
  'EVT-001':['01','Confirmed handoff','Maya → Liam','Aug 25 · 09:00'],
  'EVT-002':['02','Handoff of a handoff','Liam → Sofia','Aug 25 · 10:00'],
  'EVT-003':['03','Transfer requested','Noah → Emma','Aug 25 · 11:00'],
  'EVT-004':['04','Confirmation received','Emma accepts REQ-003','Aug 25 · 12:00']
};
const SHIFT_ROWS=[['SHF-260826-E','Wed Aug 26','Harbor Hub Close'],['SHF-260827-M','Thu Aug 27','Supply Point Open'],['SHF-260828-M','Fri Aug 28','Harbor Hub Open'],['SHF-260828-E','Fri Aug 28','Supply Point Close']];
const $=id=>document.getElementById(id), esc=v=>String(v??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let busy=false,lastSnapshot=null; const run=$('run'),loading=$('loading'),sync=$('sync');
run.value=localStorage.getItem('shiftchain.run')||'';
function shortTask(v){return v?v.split('/').pop():'—'}
function statusClass(s){return s==='VERIFIED'?'verified':s==='WAITING_CONFIRMATION'?'waiting':''}
function activityFacts(events,ledger,runDoc){
  const facts=[]; const e=Object.fromEntries(events.map(x=>[x.event_id,x]));
  if(e['EVT-001']?.workflow_status!=='RECEIVED')facts.push(['EVT-001 received','Gemini interpreted the handoff']);
  if(e['EVT-001']?.workflow_status==='VERIFIED')facts.push(['Maya → Liam','Applied and readback verified']);
  if(e['EVT-002']?.workflow_status==='VERIFIED')facts.push(['Liam → Sofia','Causal custody validated']);
  if(e['EVT-003']?.workflow_status==='WAITING_CONFIRMATION')facts.push(['Waiting safely','Recipient confirmation required']);
  const acts=e['EVT-003']?.activity||[];
  if(acts.some(x=>x.result==='WAIT_CONDITION_NOT_MET'))facts.push(['Initial wake','Condition not met · safe no-op']);
  if(e['EVT-003']?.confirmation_evidence)facts.push(['Confirmation received','Resume scheduled automatically']);
  if(ledger.some(x=>x.event_type==='TRANSFER_APPLIED'&&x.request_id==='REQ-003'))facts.push(['Workflow resumed','Noah → Emma applied']);
  if(ledger.some(x=>x.event_type==='TRANSFER_VERIFIED'&&x.request_id==='REQ-003'))facts.push(['Business effect verified','Independent Firestore readback']);
  if(runDoc.failure_injection_used)facts.push(['Acknowledgement lost','Controlled reliability test · HTTP 503']);
  if(ledger.some(x=>x.event_type==='NO_OP_VERIFIED'))facts.push(['Same task returned','Existing effect found · NO_OP_VERIFIED']);
  return facts.length?facts:[['Ready','Deliver EVT-001 to begin']];
}
function render(snapshot){
  lastSnapshot=snapshot; const rd=snapshot.run, events=snapshot.events, ledger=snapshot.ledger, e=Object.fromEntries(events.map(x=>[x.event_id,x]));
  const v1=e['EVT-001']?.workflow_status==='VERIFIED',v2=e['EVT-002']?.workflow_status==='VERIFIED';
  const b=e['EVT-003']||{}, bVerified=b.workflow_status==='VERIFIED', bWaiting=b.workflow_status==='WAITING_CONFIRMATION';
  const confirmed=!!b.confirmation_evidence, lost=!!rd.failure_injection_used, noop=ledger.find(x=>x.event_type==='NO_OP_VERIFIED');
  const shift=rd.shifts['SHF-260827-M'], attempts=(b.activity||[]).filter(x=>x.task_attempt!=null); const retry=attempts.length?attempts[attempts.length-1].task_attempt:'—';
  const eventCards=events.filter(x=>EVENT_COPY[x.event_id]).map(x=>{const c=EVENT_COPY[x.event_id],done=x.workflow_status!=='RECEIVED';return `<article class="event"><div class="event-head"><span class="event-num">${c[0]} · ${c[3]}</span><span class="status ${statusClass(x.workflow_status)}">${esc(x.workflow_status.replaceAll('_',' '))}</span></div><h3>${c[1]}</h3><p>${c[2]}</p><button class="deliver" data-event="${x.event_id}" ${done||busy?'disabled':''}>${done?'Delivered':'Deliver '+x.event_id}</button><details><summary class="panel-sub">Source message</summary><p>${esc(x.source_message)}</p></details></article>`}).join('');
  const edge=(on,label)=>`<div class="edge ${on?'verified':''}"><span class="edge-label">${label}</span></div>`;
  const bedge=bVerified?'verified':bWaiting?'waiting':''; const blabel=bVerified?'Verified · REQ-003':confirmed?'Confirmation received · resume scheduled':bWaiting?'Waiting for confirmation':'Awaiting EVT-003';
  let moment=`<div class="moment"><strong>Persistent truth is ready</strong><span>Deliver events to make the responsibility journey visible.</span></div>`;
  if(lost&&!noop)moment=`<div class="moment lost"><strong>ACKNOWLEDGEMENT LOST — HTTP 503</strong><span>Controlled reliability test · business effect remains VERIFIED.</span></div>`;
  if(noop)moment=`<div class="moment proven"><strong>NO_OP_VERIFIED</strong><span>The retry verified the existing effect instead of repeating it.</span></div>`;
  const facts=activityFacts(events,ledger,rd).map(x=>`<div class="activity-item"><strong>${x[0]}</strong>${x[1]}</div>`).join('');
  const responsibilities=SHIFT_ROWS.map(([id,date,label])=>{const s=rd.shifts[id],w=rd.workers[s.current_owner_id];return `<div class="responsibility"><time>${date}</time><strong>${label}</strong><span class="owner">${esc(w.name)}</span></div>`}).join('');
  const task=shortTask(b.scheduled_task_name); const idMatch=!!(b.applied_ledger_id&&ledger.some(x=>x.ledger_event_id===b.applied_ledger_id));
  $('app').innerHTML=`<div class="grid">
    <section class="panel"><h2 class="panel-title">Event stream</h2><p class="panel-sub">Four frozen facts. You control delivery.</p><div class="event-list">${eventCards}</div></section>
    <section class="panel journey"><h2 class="panel-title">Responsibility journey</h2><p class="panel-sub">Custody, not a calendar, is the product.</p>
      <div class="chain"><div class="chain-label"><strong>Chained handoff</strong><span>Dependency-aware custody</span></div><div class="journey-row"><div class="person active"><strong>Maya</strong><small>W-001 · original owner</small></div>${edge(v1,v1?'Verified · REQ-001':'Awaiting EVT-001')}<div class="person ${v1?'active':''}"><strong>Liam</strong><small>W-002 · received custody</small></div>${edge(v2,v2?'Verified · REQ-002':'Awaiting EVT-002')}<div class="person ${v2?'active':''}"><strong>Sofia</strong><small>W-003 · current owner</small></div></div></div>
      <div class="chain"><div class="chain-label"><strong>Temporal handoff</strong><span>Autonomous wait and resume</span></div><div class="journey-row two"><div class="person active"><strong>Noah</strong><small>W-004 · original owner</small></div><div class="edge ${bedge}"><span class="edge-label">${blabel}</span></div><div class="person ${bVerified?'active':''}"><strong>Emma</strong><small>W-005 · ${bVerified?'verified owner':'intended recipient'}</small></div></div>${moment}</div>
    </section>
    <aside class="panel evidence-panel"><h2 class="panel-title">System evidence</h2><p class="panel-sub">Firestore is the source of truth.</p><div class="evidence-grid">
      <div class="metric"><label>Request</label><strong>REQ-003</strong></div><div class="metric"><label>State</label><strong>${esc(b.workflow_status)}</strong></div>
      <div class="metric"><label>Shift version</label><strong>${shift.version}</strong></div><div class="metric"><label>Schedule version</label><strong>${rd.schedule_version}</strong></div>
      <div class="metric"><label>Resume generation</label><strong>${b.resume_generation||0}</strong></div><div class="metric"><label>Retry</label><strong>${esc(retry)}</strong></div>
      <div class="metric wide"><label>Cloud Task</label><strong>${esc(task)}</strong></div><div class="metric"><label>Idempotency</label><strong class="${idMatch?'match':''}">${idMatch?'MATCH':'PENDING'}</strong></div><div class="metric"><label>Readback</label><strong class="${bVerified?'match':''}">${bVerified?'VERIFIED':'PENDING'}</strong></div>
    </div><div class="proof-card"><h3>Reliability proof · ${rd.fault_injection?'ON':'OFF'}</h3><div class="proof-row"><span>Attempt 1</span><strong>${lost?'HTTP 503':'Pending'}</strong></div><div class="proof-row"><span>Retry</span><strong>${noop?'NO_OP_VERIFIED':'Pending'}</strong></div><div class="proof-row"><span>Versions</span><strong>${noop?`${shift.version} → ${shift.version}`:'—'}</strong></div><div class="proof-row"><span>Custody</span><strong>${bVerified?'Noah → Emma':'Noah'}</strong></div></div>
    </aside></div>
    <div class="lower"><section class="panel"><h2 class="panel-title">Agent activity</h2><p class="panel-sub">Observable actions only — no private reasoning.</p><div class="activity">${facts}</div></section><section class="panel"><h2 class="panel-title">Current responsibilities</h2><p class="panel-sub">Compact context, never the protagonist.</p><div class="responsibilities">${responsibilities}</div></section></div>`;
  document.querySelectorAll('.deliver').forEach(x=>x.addEventListener('click',()=>deliver(x.dataset.event)));
}
async function refresh(){if(!run.value||busy)return;try{const r=await fetch('/api/runs/'+encodeURIComponent(run.value));if(r.ok){render(await r.json());sync.textContent='Live · '+new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit'})}}catch(e){sync.textContent='Reconnecting…'}}
async function resetDemo(){busy=true;loading.hidden=false;loading.textContent='Creating a fresh persistent run…';try{const r=await fetch('/api/demo/reset',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({reliability_proof:$('reliability').checked})});if(!r.ok)throw Error('Reset failed');const j=await r.json();run.value=j.run_id;localStorage.setItem('shiftchain.run',j.run_id)}catch(e){loading.textContent=e.message;loading.classList.add('error');await new Promise(x=>setTimeout(x,1600))}finally{busy=false;loading.hidden=true;loading.classList.remove('error');await refresh()}}
async function deliver(id){if(!run.value||busy)return;busy=true;loading.hidden=false;loading.textContent=id==='EVT-004'?'Interpreting confirmation and scheduling autonomous resume…':'Interpreting handoff with Gemini…';try{const r=await fetch('/api/events/'+id+'/deliver',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({run_id:run.value})});if(!r.ok){const j=await r.json();throw Error(j.detail||'Delivery failed')}}catch(e){loading.textContent=e.message;loading.classList.add('error');await new Promise(x=>setTimeout(x,1800))}finally{busy=false;loading.hidden=true;loading.classList.remove('error');await refresh()}}
$('reset').addEventListener('click',resetDemo); if(run.value)refresh(); setInterval(refresh,2000);
</script>
</body>
</html>
