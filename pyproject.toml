[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "shiftchain"
version = "0.1.0"
description = "Deterministic custody engine for operational shift handoffs"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.141,<1",
  "google-adk==2.7.1",
  "google-cloud-firestore==2.29.0",
  "google-cloud-tasks==2.24.0",
  "google-genai==2.19.0",
  "pydantic>=2.12,<3",
  "python-dotenv>=1.1,<2",
  "uvicorn>=0.52,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<10",
  "pytest-cov>=6.2,<8",
]

[project.scripts]
shiftchain-demo = "shiftchain.demo:main"
shiftchain-gemini-check = "shiftchain.gemini_check:main"

[tool.hatch.build.targets.wheel]
packages = ["src/shiftchain"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]
