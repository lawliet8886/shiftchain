<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">ShiftChain architecture</title><desc id="desc">A judge uses the Cloud Run interface. Google ADK calls Gemini for structured intent, deterministic code controls Firestore mutations, and Cloud Tasks resumes the workflow with OIDC.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0l10 5-10 5z" fill="#5f6368"/></marker><style>.bg{fill:#f7f6f1}.cloud{fill:#fff;stroke:#d6d6cf;stroke-width:1.5}.node{fill:#eef0ff;stroke:#3949ab;stroke-width:2}.truth{fill:#e9f6ee;stroke:#177245;stroke-width:2}.time{fill:#fff3da;stroke:#a45b00;stroke-width:2}.external{fill:#fff;stroke:#80868b;stroke-width:2}.title{font:700 26px Inter,Arial,sans-serif;fill:#202124}.subtitle{font:400 14px Inter,Arial,sans-serif;fill:#65676b}.label{font:700 16px Inter,Arial,sans-serif;fill:#202124}.small{font:400 12px Inter,Arial,sans-serif;fill:#5f6368}.edge{fill:none;stroke:#5f6368;stroke-width:2;marker-end:url(#arrow)}.dash{stroke-dasharray:7 6}.pill{fill:#fff;stroke:#d6d6cf}.pilltext{font:700 11px Inter,Arial,sans-serif;fill:#3949ab;letter-spacing:.5px}</style></defs>
  <rect class="bg" width="1200" height="700" rx="24"/><text class="title" x="48" y="50">ShiftChain · Responsibility moves. Truth persists.</text><text class="subtitle" x="48" y="76">Real production path — no component in this diagram is simulated.</text><rect class="pill" x="945" y="32" width="207" height="32" rx="16"/><text class="pilltext" x="966" y="53">GOOGLE CLOUD · US-CENTRAL1</text>
  <rect class="external" x="42" y="266" width="174" height="98" rx="18"/><text class="label" x="129" y="306" text-anchor="middle">Judge / Browser</text><text class="small" x="129" y="332" text-anchor="middle">one-screen live demo</text>
  <rect class="cloud" x="258" y="104" width="894" height="520" rx="24"/><text class="small" x="282" y="132">GOOGLE CLOUD RUNTIME</text>
  <rect class="node" x="300" y="170" width="250" height="118" rx="18"/><text class="label" x="425" y="210" text-anchor="middle">Cloud Run</text><text class="small" x="425" y="235" text-anchor="middle">judge UI · public API</text><text class="small" x="425" y="255" text-anchor="middle">OIDC resume handler</text>
  <rect class="node" x="652" y="170" width="236" height="118" rx="18"/><text class="label" x="770" y="210" text-anchor="middle">Google ADK</text><text class="small" x="770" y="235" text-anchor="middle">shiftchain_agent</text><text class="small" x="770" y="255" text-anchor="middle">four bounded tools</text>
  <rect class="external" x="950" y="170" width="166" height="118" rx="18"/><text class="label" x="1033" y="206" text-anchor="middle">Gemini 3.7 Flash</text><text class="small" x="1033" y="233" text-anchor="middle">structured ShiftIntent</text><text class="small" x="1033" y="253" text-anchor="middle">intent only</text>
  <rect class="node" x="652" y="388" width="236" height="118" rx="18"/><text class="label" x="770" y="425" text-anchor="middle">Deterministic engine</text><text class="small" x="770" y="451" text-anchor="middle">versions · custody · consent</text><text class="small" x="770" y="471" text-anchor="middle">idempotency · verification</text>
  <rect class="truth" x="950" y="388" width="166" height="118" rx="18"/><text class="label" x="1033" y="427" text-anchor="middle">Firestore</text><text class="small" x="1033" y="453" text-anchor="middle">persistent truth</text><text class="small" x="1033" y="473" text-anchor="middle">checkpoint · ledger</text>
  <rect class="time" x="300" y="388" width="250" height="118" rx="18"/><text class="label" x="425" y="427" text-anchor="middle">Cloud Tasks</text><text class="small" x="425" y="453" text-anchor="middle">delayed wake · retry</text><text class="small" x="425" y="473" text-anchor="middle">at-least-once + OIDC</text>
  <rect class="time" x="300" y="542" width="250" height="56" rx="15"/><text class="label" x="425" y="566" text-anchor="middle">Secret Manager</text><text class="small" x="425" y="585" text-anchor="middle">runtime secret reference</text>
  <path class="edge" d="M216 315H300"/><text class="small" x="239" y="304">HTTPS</text><path class="edge" d="M550 229H652"/><text class="small" x="573" y="216">bounded tools</text><path class="edge" d="M888 229H950"/><text class="small" x="894" y="216">intent</text><path class="edge" d="M770 288V388"/><text class="small" x="784" y="343">validated intent</text><path class="edge" d="M888 447H950"/><text class="small" x="897" y="433">transaction</text><path class="edge" d="M652 462H550"/><text class="small" x="566" y="450">enqueue g1 / g2</text><path class="edge" d="M425 388V288"/><text class="small" x="438" y="343">OIDC resume</text><path class="edge dash" d="M300 570H270V229H300"/><text class="small" x="278" y="530" transform="rotate(-90 278 530)">secret reference</text>
  <text class="small" x="300" y="656">Gemini understands intent.</text><text class="small" x="504" y="656">Deterministic code controls mutation.</text><text class="small" x="786" y="656">Firestore remembers.</text><text class="small" x="974" y="656">Cloud Tasks wakes.</text>
</svg>
